name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  GO_VERSION: 1.26.5
  ZOEKT_COMMIT: 8080dcef6e12eeec0ca03336dbb71a918bc7bdd1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out MCP
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out pinned Zoekt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: IIITYRAELIII/zoekt
          ref: ${{ env.ZOEKT_COMMIT }}
          path: .zoekt

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Unit tests
        shell: pwsh
        run: go test ./...

      - name: Build Zoekt test backend
        shell: pwsh
        working-directory: .zoekt
        run: |
          [IO.Directory]::CreateDirectory('bin') | Out-Null
          go build -o bin/zoekt-index.exe ./cmd/zoekt-index
          go build -o bin/zoekt-webserver.exe ./cmd/zoekt-webserver

      - name: MCP protocol probe
        shell: pwsh
        run: |
          .\tools\probe.ps1 -Go go -ZoektBin "$PWD\.zoekt\bin"

      - name: Build release directory
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 `
            -Go go `
            -ZoektSource "$PWD\.zoekt" `
            -OutputDirectory "$PWD\dist\windows-x64" `
            -Version "${{ github.ref_name }}"

      - name: Package release archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\dist\windows-x64\* `
            -DestinationPath .\dist\bsl-code-search-mcp-windows-x64.zip
          (Get-FileHash `
            .\dist\bsl-code-search-mcp-windows-x64.zip `
            -Algorithm SHA256
          ).Hash.ToLowerInvariant() |
            Set-Content `
              .\dist\bsl-code-search-mcp-windows-x64.zip.sha256 `
              -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bsl-code-search-mcp-windows-x64
          path: |
            dist/bsl-code-search-mcp-windows-x64.zip
            dist/bsl-code-search-mcp-windows-x64.zip.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            .\dist\bsl-code-search-mcp-windows-x64.zip `
            .\dist\bsl-code-search-mcp-windows-x64.zip.sha256 `
            --verify-tag `
            --generate-notes
